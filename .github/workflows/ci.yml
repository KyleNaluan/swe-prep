name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Enforce the public-engine/private-content rule (issue #4/#14): fail the
      # build if any problem statement, test data or reference solution has been
      # committed to this public repo. Runs before anything expensive.
      - name: Assert no private content is committed
        run: ./scripts/check-no-content.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # test.sh runs `npm test`, not `npm install` - that's a prerequisite
      # step for local dev covered by README.md, not part of the documented
      # test command itself. Docker is already present and running on
      # GitHub-hosted runners, which is what the backend suite needs for its
      # Testcontainers Postgres.
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run test suite
        run: ./test.sh
