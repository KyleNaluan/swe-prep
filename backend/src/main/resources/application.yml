sweprep:
  content:
    # Local clone of the private swe-prep-content repo. It is NOT a submodule and
    # is gitignored (see /content/ in .gitignore): no problem statement, test data
    # or reference solution is ever committed to this public repo (issue #4/#14).
    # The default assumes the backend is run from backend/ (as the README says) and
    # the content repo is cloned into <repo-root>/content. Override with the
    # SWEPREP_CONTENT_PATH env var to point at a clone elsewhere.
    path: ${SWEPREP_CONTENT_PATH:../content}
  sql:
    # The SQL domain's fixture database and read-only role (issue #25, decision #10),
    # provisioned automatically on the same Postgres instance the moment a SQL exercise
    # is first attempted. Left at their defaults: this is a single-user local app and the
    # role can only SELECT inside fixture schemas, so these are no more a secret than the
    # docker-compose Postgres password already is. Override with SWEPREP_SQL_* if ever
    # pointed at a shared instance.
    fixture-database: ${SWEPREP_SQL_FIXTURE_DATABASE:sweprep_fixtures}
    reader-username: ${SWEPREP_SQL_READER_USERNAME:sweprep_fixture_reader}
    reader-password: ${SWEPREP_SQL_READER_PASSWORD:sweprep_fixture_reader}
  commit:
    # Solution auto-commit (issue #22, decision issue #7 item 1): every solved coding
    # problem is committed - and, by default, pushed - to the private content repo's
    # local clone, so the GitHub contribution graph is a real record the app cannot
    # fake. Deliberately reuses the same clone as sweprep.content.path above, not a
    # second one - decision #7 is explicit that solutions live in the same private
    # swe-prep-content repo, just under a different directory (solutionsDir below).
    enabled: ${SWEPREP_AUTOCOMMIT_ENABLED:true}
    repo-path: ${SWEPREP_COMMIT_REPO_PATH:${sweprep.content.path}}
    push: ${SWEPREP_AUTOCOMMIT_PUSH:true}
    solutions-dir: solutions
    # Commit identity (author-name/author-email) is deliberately absent here, so JGit
    # resolves it from the clone's own git config - its real committer identity,
    # already configured on a genuine clone - rather than a value here overriding it.
    # Set SWEPREP_COMMIT_AUTHOR_NAME/SWEPREP_COMMIT_AUTHOR_EMAIL to force a specific
    # identity - most useful for tests pointed at a throwaway repo fixture.
  readiness:
    # Shaky/stale topic thresholds (issue #22), applied only to topics that have been
    # attempted at least once - an untouched topic is "not covered", a different axis
    # (checksToCriterion), not "shaky" or "stale".
    shaky-threshold: ${SWEPREP_READINESS_SHAKY_THRESHOLD:0.5}
    stale-after-days: ${SWEPREP_READINESS_STALE_AFTER_DAYS:14}
  streak:
    # The capped repair mechanic (issue #22, decision #7 item 5): a missed day can be
    # repaired by a double session (warm-up plus a solved challenge) the next day, so
    # the streak survives one bad evening. Capped "roughly twice a month" per the
    # decision's own wording.
    max-repairs-per-month: ${SWEPREP_STREAK_MAX_REPAIRS_PER_MONTH:2}
  web:
    # Browser origins allowed to call the backend directly, comma-separated. The single
    # source for both WebConfig's CORS mapping and the actuator's CORS config below - it
    # used to be the same localhost literal hardcoded in both places, which is what let
    # the app fail silently the moment Vite ran on any other port (issue #34). Not
    # actually load-bearing for the frontend's own calls in dev, since the Vite dev
    # server proxies them same-origin (frontend/vite.config.ts) - this is for anything
    # that calls the backend directly instead. Override with SWEPREP_ALLOWED_ORIGINS.
    allowed-origins: ${SWEPREP_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5433/sweprep
    username: sweprep
    password: sweprep
  flyway:
    enabled: true

management:
  endpoints:
    web:
      cors:
        allowed-origins: ${sweprep.web.allowed-origins}
        allowed-methods: GET
  endpoint:
    health:
      # Component-by-component detail (DB status, etc.) is only for
      # authorised callers. There is no auth mechanism in this app yet, so
      # today that means nobody gets it - only the top-level UP/DOWN status
      # does, which is all the front end has ever read. When auth lands,
      # this starts working correctly with no further change needed here.
      show-details: when-authorized
